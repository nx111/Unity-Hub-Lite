[package]
name = "unity-hub-lite"
version = "0.1.0"
description = "A lightweight offline Unity Editor installer"
authors = ["Unity Hub Lite"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"
dirs = "6"
base64 = "0.22"
md-5 = "0.10"
sha2 = "0.10"
